<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="byungsin 관리자 전용 페이지">
  <title>byungsin — 관리자 전용</title>
  <link rel="stylesheet" href="style.css?v=64">
</head>
<body>
  <main class="admin-page">
    <div class="admin-shell">
      <div class="eyebrow">
        <a class="brand" href="index.html">byungsin<span style="color:var(--orange)">.</span></a>
        <span>ADMIN ONLY</span>
      </div>
      <section class="admin-card admin-console">
        <span class="admin-kicker">restricted access</span>
        <h1>관리자 전용</h1>
        <p>아이템을 선택해 특정 유저 또는 모든 유저에게 메시지와 함께 지급하거나, 선택한 유저의 아이템을 차감할 수 있습니다.</p>
        <form id="admin-grant-form">
          <div class="admin-form-grid">
            <label>지급 대상
              <select id="admin-target-user">
                <option value="">모든 유저</option>
              </select>
            </label>
            <label>수량
              <input id="admin-grant-quantity" type="number" min="1" max="1000000" value="1" required>
            </label>
          </div>
          <div class="admin-item-heading">
            <span>아이템 선택</span>
            <strong id="admin-selected-item">아이템을 선택하세요.</strong>
          </div>
          <div class="admin-item-grid" id="admin-item-grid"></div>
          <label>전달할 메시지
            <textarea id="admin-grant-message" maxlength="500" rows="4" placeholder="지급과 함께 보낼 메시지를 입력하세요." required></textarea>
          </label>
          <div class="admin-grant-actions">
            <button type="submit" id="admin-grant-target">선택 유저에게 지급</button>
            <button type="button" id="admin-grant-all">모든 유저에게 지급</button>
            <button type="button" id="admin-remove-target">선택 유저에게서 차감</button>
          </div>
          <p class="admin-status" id="admin-status" role="status"></p>
        </form>
        <a class="admin-back" href="index.html">메인 사이트로 돌아가기 ↗</a>
      </section>
    </div>
  </main>
  <script src="admin.js?v=3"></script>
</body>
</html>
