<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sanggi</title>
  <link rel="stylesheet" href="style.css?v=69">
</head>
<body class="placeholder-page sanggi-page">
  <main aria-label="Sanggi street scene">
    <div class="sanggi-coin-display" aria-label="Coin">
      <svg class="sanggi-coin-icon" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="20" fill="#ffd45c" stroke="#6e4b28" stroke-width="3"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="#e6a83d" stroke-width="2"/>
        <path d="M27.8 14.8c-1.1-.8-2.5-1.2-4-1.2-3.2 0-5.4 1.7-5.4 4.2 0 5.8 9.9 2.7 9.9 7.2 0 1.8-1.7 3.1-4.3 3.1-1.8 0-3.4-.6-4.6-1.7M24 11v26" fill="none" stroke="#6e4b28" stroke-linecap="round" stroke-width="2"/>
      </svg>
    </div>
    <div class="sanggi-coin-balance" aria-label="Coin balance">
      <small>COIN</small>
      <strong id="sanggi-coin-balance">0</strong>
    </div>
    <a class="sanggi-home-button" href="index.html" aria-label="Home" title="Home">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="m7 23 17-14 17 14v17a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V23Z" fill="#fff7dc" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
        <path d="M19 43V29h10v14M5 23 24 7l19 16" fill="none" stroke="#2a2730" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </a>
    <button class="sanggi-refresh-button" type="button" aria-label="새로고침" title="새로고침" onclick="window.location.reload()">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M39 18a16 16 0 1 0 2 12" fill="none" stroke="#2a2730" stroke-width="4" stroke-linecap="round"/>
        <path d="M38 8v12H26" fill="none" stroke="#2a2730" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="sanggi-sky"></div>
    <div class="sanggi-moon"></div>
    <div class="sanggi-city"></div>
    <div class="sanggi-street"></div>
    <div class="sanggi-lamp sanggi-lamp-left"></div>
    <div class="sanggi-lamp sanggi-lamp-right"></div>
    <img class="sanggi-character" src="sanggi-character.png" alt="Sanggi character">
    <nav class="sanggi-action-bar" aria-label="상기 키우기 메뉴">
      <button type="button" class="sanggi-action-button">
        <span class="sanggi-action-icon">★</span>
        <span>상기 능력</span>
      </button>
      <button type="button" class="sanggi-action-button">
        <span class="sanggi-action-icon">+</span>
        <span>동료 소환</span>
      </button>
      <button type="button" class="sanggi-action-button">
        <span class="sanggi-action-icon">⌂</span>
        <span>배경 구매</span>
      </button>
      <button type="button" class="sanggi-action-button">
        <span class="sanggi-action-icon">▣</span>
        <span>상점</span>
      </button>
    </nav>
  </main>
</body>
</html>
