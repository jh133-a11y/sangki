<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>기록(?) — byungsin</title>
  <link rel="stylesheet" href="style.css?v=30">
</head>
<body class="records-page">
  <main class="records-shell">
    <header class="records-site-header">
      <a class="records-logo" href="playground.html">기록(?)</a>
      <nav><a href="index.html">홈</a><a href="archive.html">상점</a><a href="projects.html">상기 키우기</a><a href="index.html">이용안내</a></nav>
    </header>
    <section class="records-gallery-head">
      <div class="records-gallery-image" aria-hidden="true"><span>기록</span></div>
      <div>
        <h1>기록(?)</h1>
        <p>자유롭게 글을 남기고 이야기를 나누는 게시판입니다.</p>
        <dl><div><dt>게시판</dt><dd>기록(?)</dd></div><div><dt>전체 글</dt><dd id="records-count">불러오는 중</dd></div><div><dt>운영</dt><dd>자유 게시판</dd></div></dl>
      </div>
    </section>
    <section class="records-tabs" aria-label="게시판 메뉴">
      <button class="is-active" type="button">전체글</button><button type="button">일반</button><button type="button">공지</button>
    </section>
    <section class="records-toolbar">
      <span>기록(?) 게시판</span>
      <div class="records-toolbar-actions">
        <button class="records-button" id="records-notice-button" type="button">공지</button>
        <button class="records-button records-button-dark" id="records-write-button" type="button">글쓰기</button>
      </div>
    </section>
    <section class="records-board">
      <div class="records-table-head"><span>번호</span><span>말머리</span><span>제목</span><span>글쓴이</span><span>작성일</span><span>조회</span><span>추천</span></div>
      <section class="records-notices" id="records-notices" aria-label="공지사항"></section>
      <section class="records-list" id="records-list" aria-live="polite"><p class="records-empty">게시물을 불러오는 중...</p></section>
    </section>
    <p class="records-status" id="records-status" role="status"></p>
  </main>

  <div class="records-backdrop" id="records-backdrop" hidden></div>
  <section class="records-modal" id="records-post-modal" role="dialog" aria-modal="true" aria-labelledby="records-post-title" hidden>
    <button class="records-modal-close" data-close-modal type="button" aria-label="닫기">×</button>
    <h2 id="records-post-title">글쓰기</h2>
    <form id="records-post-form">
      <input type="hidden" id="records-post-id">
      <label>닉네임<input id="records-post-nickname" maxlength="24" required></label>
      <label>비밀번호<input id="records-post-password" type="password" minlength="4" maxlength="72" required></label>
      <label>제목<input id="records-post-subject" maxlength="100" required></label>
      <label>내용<textarea id="records-post-body" maxlength="5000" rows="9" required></textarea></label>
      <button class="records-submit" type="submit">저장하기</button>
      <p class="records-form-status" id="records-post-form-status"></p>
    </form>
  </section>

  <section class="records-modal" id="records-comment-modal" role="dialog" aria-modal="true" aria-labelledby="records-comment-title" hidden>
    <button class="records-modal-close" data-close-modal type="button" aria-label="닫기">×</button>
    <h2 id="records-comment-title">댓글 쓰기</h2>
    <form id="records-comment-form">
      <input type="hidden" id="records-comment-post-id">
      <input type="hidden" id="records-comment-parent-id">
      <label>닉네임<input id="records-comment-nickname" maxlength="24" required></label>
      <label>비밀번호<input id="records-comment-password" type="password" minlength="4" maxlength="72" required></label>
      <label>내용<textarea id="records-comment-body" maxlength="1000" rows="5" required></textarea></label>
      <button class="records-submit" type="submit">댓글 등록</button>
      <p class="records-form-status" id="records-comment-form-status"></p>
    </form>
  </section>

  <section class="records-modal" id="records-notice-modal" role="dialog" aria-modal="true" aria-labelledby="records-notice-title" hidden>
    <button class="records-modal-close" data-close-modal type="button" aria-label="닫기">×</button>
    <h2 id="records-notice-title">공지 작성</h2>
    <form id="records-notice-form">
      <input type="hidden" id="records-notice-id">
      <label>제목<input id="records-notice-subject" maxlength="100" required></label>
      <label>내용<textarea id="records-notice-body" maxlength="5000" rows="8" required></textarea></label>
      <button class="records-submit" type="submit">공지 저장</button>
      <p class="records-form-status" id="records-notice-form-status"></p>
    </form>
  </section>

  <script src="records.js?v=3"></script>
</body>
</html>
